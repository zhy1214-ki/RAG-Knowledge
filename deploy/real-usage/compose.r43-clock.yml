# OFFLINE PREPARATION ONLY. New deployment and manual clock acknowledgment require explicit authorization.
services:
  real-backend:
    image: rag-knowledge-real-backend:r43-clock-candidate
    environment:
      MODEL_REQUESTS_PER_MINUTE: '5'
      R1_APPROVAL_ID: ${R43_APPROVAL_ID:-}
      R1_APPROVAL_SHA256: ${R43_APPROVAL_SHA256:-}
    volumes:
    - type: bind
      source: ./approval.r43-clock.json
      target: /opt/rag/deploy/real-usage/approval.r43-clock.json
      read_only: true
      bind:
        create_host_path: false
    command:
    - python
    - /opt/rag/scripts/real_usage_runtime.py
    - serve
    - --runtime-mode
    - real
    - --approval-file
    - /opt/rag/deploy/real-usage/approval.r43-clock.json
